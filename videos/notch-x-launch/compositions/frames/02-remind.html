<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* ── Frame 02 — Remind ───────────────────────────────────────────
           Identical desktop/notch/glass/springs to Frame 01 (continuity).
           Differs only in typed line, intent hint, and the feedback line. */

        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          font-family: Inter, system-ui, sans-serif;
          -webkit-font-smoothing: antialiased;
          text-rendering: geometricPrecision;
        }
        #desk {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(120% 85% at 50% -12%, #14151b 0%, #0c0d11 38%, #07070a 72%, #050506 100%);
        }
        #desk::after {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(80% 70% at 50% 42%, transparent 55%, rgba(0,0,0,0.28) 100%);
          pointer-events: none;
        }
        #stage {
          position: absolute;
          top: 0;
          left: 50%;
          margin-left: -270px;
          width: 540px;
          display: flex;
          justify-content: center;
        }
        #shell {
          position: relative;
          width: 192px;
          height: 37px;
          margin: 0 auto;
          border-radius: 0 0 9px 9px;
          background: rgba(0,0,0,0.86);
          box-shadow: 0 5px 9px rgba(0,0,0,0.30);
          overflow: hidden;
          will-change: width, height, border-radius;
        }
        #glass {
          position: absolute;
          inset: 0;
          border-radius: inherit;
          background: rgba(0,0,0,0.55);
          backdrop-filter: blur(40px) saturate(170%);
          -webkit-backdrop-filter: blur(40px) saturate(170%);
          opacity: 0;
        }
        #glass::before {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: inherit;
          padding: 0.9px;
          background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.26) 100%);
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor;
                  mask-composite: exclude;
          pointer-events: none;
        }
        #hw {
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 32px;
          background: #000;
          z-index: 3;
        }
        #body {
          position: absolute;
          top: 32px; left: 0; right: 0;
          padding: 14px 22px 20px;
          opacity: 0;
          z-index: 2;
        }
        #promptRow {
          display: flex;
          align-items: baseline;
          min-height: 30px;
          font-size: 22px;
          line-height: 1.34;
          letter-spacing: -0.01em;
          color: rgba(255,255,255,0.96);
          white-space: pre-wrap;
          word-break: break-word;
        }
        #placeholder { color: rgba(255,255,255,0.38); }
        #typed { color: rgba(255,255,255,0.96); }
        #caret {
          display: inline-block;
          width: 2px;
          height: 1.05em;
          margin-left: 1px;
          position: relative;
          top: 3px;
          background: rgba(255,255,255,0.92);
          border-radius: 1px;
        }
        #hint {
          margin-left: 10px;
          font-size: 18px;
          color: rgba(255,255,255,0.40);
          opacity: 0;
          filter: blur(4px);
          white-space: nowrap;
        }
        /* Feedback line: white@40%, 12pt-scaled, no icon, no time suffix. */
        #feedback {
          margin-top: 13px;
          font-size: 16px;
          letter-spacing: 0.005em;
          color: rgba(255,255,255,0.40);
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="02-remind" data-width="1920" data-height="1080">
        <div id="desk" class="clip" data-start="0" data-duration="9" data-track-index="0"></div>

        <div id="stage" class="clip" data-start="0" data-duration="9" data-track-index="1">
          <div id="shell" data-layout-allow-overflow>
            <div id="glass"></div>
            <div id="hw"></div>
            <div id="body">
              <div id="promptRow">
                <span id="line"><span id="placeholder">Type anything…</span><span id="typed"></span></span><span id="caret"></span><span id="hint">— Remind</span>
              </div>
              <div id="feedback">Added to Reminders</div>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          const QUERY = "remind me to email the landlord at 6pm";

          const shell = "#shell", glass = "#glass", body = "#body";
          const placeholder = "#placeholder", typed = "#typed";
          const caret = "#caret", hint = "#hint", feedback = "#feedback";

          // Beats (frame-local). No opening hold — continues from Frame 1.
          const T_OPEN   = 0.4;
          const OPEN_DUR = 0.62;
          const T_TYPE   = 1.4;
          const TYPE_END = 5.5;
          const T_RECOG  = 6.4;
          const T_CLOSE  = 8.0;
          const CLOSE_DUR = 0.5;

          const H_CLOSED = 37, H_PROMPT = 108, H_FEEDBACK = 150;
          gsap.set(shell, { width: 192, height: H_CLOSED, borderRadius: "0px 0px 9px 9px" });
          gsap.set(body, { display: "none" });
          gsap.set([glass, body], { opacity: 0 });
          gsap.set(placeholder, { opacity: 1 });
          gsap.set([typed, caret], { opacity: 0 });
          gsap.set(hint, { opacity: 0, filter: "blur(4px)" });
          gsap.set(feedback, { opacity: 0, y: 8 });

          tl.fromTo(shell,
            { width: 192, height: H_CLOSED, borderRadius: "0px 0px 9px 9px" },
            { width: 540, height: H_PROMPT, borderRadius: "0px 0px 30px 30px", duration: OPEN_DUR, ease: "power3.out" },
            T_OPEN);
          tl.set(body, { display: "block" }, T_OPEN);
          tl.to([glass, body], { opacity: 1, duration: 0.34, ease: "power2.out" }, T_OPEN + 0.06);

          tl.set(caret, { opacity: 1 }, T_OPEN + 0.30);
          for (let t = T_OPEN + 0.30, i = 0; t < T_CLOSE; t += 0.53, i++) {
            tl.set(caret, { opacity: i % 2 === 0 ? 1 : 0.15 }, t);
          }

          tl.set(placeholder, { display: "none" }, T_TYPE);
          tl.set(typed, { opacity: 1 }, T_TYPE);
          const typeState = { n: 0 };
          tl.to(typeState, {
            n: QUERY.length,
            duration: TYPE_END - T_TYPE,
            ease: "none",
            onUpdate: function () {
              const el = document.querySelector(typed);
              if (el) el.textContent = QUERY.slice(0, Math.round(typeState.n));
            }
          }, T_TYPE);
          tl.set(typeState, { n: QUERY.length }, TYPE_END);
          tl.call(() => { const el = document.querySelector(typed); if (el) el.textContent = QUERY; }, null, TYPE_END);

          // Recognition → "— Remind" hint + "Added to Reminders"
          tl.to(shell, { height: H_FEEDBACK, duration: 0.42, ease: "power3.out" }, T_RECOG);
          tl.to(hint, { opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power2.out", overwrite: "auto" }, T_RECOG);
          tl.to(feedback, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out", overwrite: "auto" }, T_RECOG + 0.12);

          // Close
          tl.to([body, glass], { opacity: 0, duration: 0.26, ease: "power2.in" }, T_CLOSE);
          tl.to(shell,
            { width: 192, height: H_CLOSED, borderRadius: "0px 0px 9px 9px", duration: CLOSE_DUR, ease: "power3.inOut" },
            T_CLOSE + 0.12);
          tl.set(body, { display: "none" }, T_CLOSE + 0.12 + CLOSE_DUR);

          window.__timelines = window.__timelines || {};
          window.__timelines["02-remind"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
